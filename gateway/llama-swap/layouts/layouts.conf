# GPU placement for every model container llama-swap manages (see ../gpu-layout.sh).
# Pick a layout from the repo root with `make mode M=<layout>`; `make mode` alone shows
# the current one. The choice is saved in ./mode (not tracked; default split).

# card CONTAINER CARDS...
# Cards are Level Zero indices, as in ZE_AFFINITY_MASK: 0 = PCI 03:00.0, 1 = 08:00.0.
# A new container also needs adding to ../../docker-api/Caddyfile.
card qwen-vllm      0
card qwen-vllm-2    1
card qwen-vllm-tp2  0 1
card qwen-image     1
card gemma          1
card gpt-oss        0 1

# layout NAME CONTAINERS...
# Containers to keep running, in priority order, on the cards no on-demand model
# (an entry in ../config.yaml, such as qwen-image) is using. Each starts only if all
# its cards are free, so later entries are fallbacks for when an earlier one can't fit.

# One Qwen per card, behind vllm-lb. An image request takes card 1 from qwen-vllm-2;
# chat carries on on card 0.
layout split  qwen-vllm qwen-vllm-2
# Qwen across both cards (tensor parallel): ~1.5x faster per request, ~1.5x the total
# throughput of split. An image request swaps it for qwen-vllm on card 0, which costs
# chat a few minutes at each swap; see ../../../qwen-vllm/README.md.
layout tp2    qwen-vllm-tp2 qwen-vllm qwen-vllm-2
# Qwen on card 0 writes, Gemma 4 31B on card 1 reviews (../../../gemma). An image
# request takes card 1 from Gemma; Qwen carries on.
layout review qwen-vllm gemma
# gpt-oss-120b across both cards (../../../gpt-oss), on llama.cpp. Qwen3.8-27B is not
# served until an image request takes card 1: then gpt-oss stops and qwen-vllm takes
# card 0, as in tp2.
layout big    gpt-oss qwen-vllm
