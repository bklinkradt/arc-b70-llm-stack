global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Every model server carries `card` (the B70s it runs on, 0 = PCI 03:00.0, 1 = 08:00.0)
# and `model`, so the dashboard can show each card's load. Only the containers the GPU
# layout runs are up (../gateway/llama-swap); the others just fail their scrapes.
scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]
        labels: {card: "0", model: "Qwen3.8-27B"}
      - targets: ["vllm-2:8000"]
        labels: {card: "1", model: "Qwen3.8-27B"}
      - targets: ["vllm-tp2:8000"]
        labels: {card: "0+1", model: "Qwen3.8-27B (TP=2)"}

  # Gemma 4 31B on llama.cpp (../gemma), the review layout's card 1.
  - job_name: gemma
    static_configs:
      - targets: ["gemma:8000"]
        labels: {card: "1", model: "gemma-4-31B"}

  # gpt-oss-120b on llama.cpp (../../gpt-oss), the big layout, both cards.
  - job_name: gpt-oss
    static_configs:
      - targets: ["gpt-oss:8000"]
        labels: {card: "0+1", model: "gpt-oss-120b"}

  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9101"]

  # The configured GPU layout, what actually runs on each card and each model
  # container's serving config (layout_exporter.py, in ../../gateway's compose file).
  - job_name: layout
    static_configs:
      - targets: ["layout-exporter:9102"]
