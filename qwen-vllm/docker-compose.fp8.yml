# Experiment: the FP8 checkpoint (Qwen3.8-27B-FP8, block-wise e4m3) on TP=2. A copy of
# vllm-tp2 under another name, on 127.0.0.1:8003 and off llm-net, so vllm-lb never
# sends it user traffic. It needs both cards, so llama-swap and every model container
# stop first: chat is down until fp8-down. From the repo root, `make fp8 FP8_DTYPE=float16`
# does that and starts this; `make fp8-down` reverts (llama-swap restores the GPU layout).
services:
  vllm-fp8:
    extends:
      # Relative to the repo root: overrides resolve paths from the first -f file.
      file: qwen-vllm/docker-compose.yml
      service: vllm-tp2
    container_name: qwen-vllm-fp8
    profiles: [fp8]
    ports: !override
      - "127.0.0.1:8003:8000"
    networks: !override
      - default
    # Compose replaces `command` wholesale, so this repeats vllm-tp2's list with the
    # model path and the activation dtype. Keep the two in sync.
    command: !override
      - /llm/models/Qwen3.8-27B-FP8
      - --dtype=${FP8_DTYPE:-bfloat16}
      - --tensor-parallel-size=2
      - --served-model-name=Qwen3.8-27B
      - --host=0.0.0.0
      - --port=8000
      - --limit-mm-per-prompt={"image":4,"video":0}
      - --mm-processor-kwargs={"max_pixels":4194304}
      - --gpu-memory-utilization=0.92
      - --max-model-len=131072
      - --max-num-seqs=8
      - --max-num-batched-tokens=4096
      - --enable-prefix-caching
      - --speculative-config={"method":"mtp","num_speculative_tokens":3}
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
