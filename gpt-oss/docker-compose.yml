# gpt-oss-120b (OpenAI, 117B MoE, 5.1B active) on llama.cpp SYCL across both B70s. Only
# the `big` GPU layout runs it (`make mode M=big`). ~88 tok/s decode, 128k context
# (README.md). The 59 GiB MXFP4 GGUF fits the two cards with nothing on the CPU.
name: gpt-oss

services:
  gpt-oss:
    # llama.cpp b11669 (commit 620d2225c), oneAPI 2026.1. Older builds decode gpt-oss at
    # ~37 tok/s (no MXFP4 MoE kernels) and corrupt long prompts with --split-mode tensor.
    image: ghcr.io/ggml-org/llama.cpp:full-intel@sha256:9ddf4bfc321a20226f831891fc9b40610f11a9a50e5171b876b1e608493babee
    # Fixed name: llama-swap's gpu-layout (../gateway) starts and stops it by name.
    container_name: gpt-oss
    # llama-swap owns the lifecycle, so `docker compose up` must not start it and
    # auto-restart must not bring it back next to whatever took its cards.
    profiles: [managed]
    restart: "no"
    # Level Zero lists only the Intel cards, in PCI order; both of them.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-39}"   # video; `getent group video render` on your host
      - "${RENDER_GID:-105}" # render
    environment:
      ZE_AFFINITY_MASK: "0,1"
      ONEAPI_DEVICE_SELECTOR: level_zero:*
    volumes:
      - ${MODELS_DIR:-${HOME}/models}:/models:ro
    # Localhost only: remote access goes through the gateway, which adds API keys.
    ports:
      - "127.0.0.1:8004:8000"
    networks:
      - default
      - llm-net
    entrypoint: ["/app/llama-server"]
    # Flag and value as separate items: llama.cpp rewrites "_" to "-" in "--flag=value".
    command: [
      "--model", "/models/${GPT_OSS_MODEL:-gpt-oss-120b-GGUF/gpt-oss-120b-MXFP4.gguf}",
      "--alias", "gpt-oss-120b",
      "--host", "0.0.0.0",
      "--port", "8000",
      # --fit places the weights instead of --n-gpu-layers (which turns fitting off). Whole
      # layers (~1.6 GiB each) can't even out the cards, and card 0 ran out at 128k; fit
      # splits a layer's tensors across them, so each card keeps ~1 GiB free. It sizes to the
      # VRAM free at start, which in the big layout is both whole cards.
      "--fit", "on",
      "--fit-target", "512",
      # layer, not tensor: faster decode at load here (224 vs 198 tok/s at 8 requests),
      # and tensor has hung under concurrent requests on older builds.
      "--split-mode", "layer",
      # 128k, gpt-oss's maximum: 2.4 GiB of KV cache at q8_0, split across the cards.
      # Set explicitly, so fit doesn't shrink it: short of VRAM, fit moves weights to system
      # RAM instead (slower; watch for a CPU model buffer bigger than ~590 MiB in the log).
      "--ctx-size", "131072",
      "--flash-attn", "on",
      "--cache-type-k", "q8_0",
      "--cache-type-v", "q8_0",
      # Four slots sharing one KV pool: one request can use all 128k.
      "--parallel", "4",
      "--kv-unified",
      "--jinja",
      "--metrics",
    ]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s

networks:
  llm-net:
    external: true
